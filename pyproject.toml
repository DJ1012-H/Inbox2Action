[project]
name = "inbox2action"
version = "0.1.0"
description = "Safety-first staged validation of a DeepSeek model for Inbox2Action"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.4.1",
    "openai>=2.48.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox2action"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
markers = [
    "integration: opt-in tests that may call the configured DeepSeek API",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
